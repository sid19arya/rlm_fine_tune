## V0 smoke test -- Qwen3-8B, 2x A40, 20 steps, 32 rollouts/step.
##
## The schema here is prime-rl's. This file is derived from
## training/configs/rlm-qwen3-30b-example.toml in the rlm checkout, scaled down
## to two Ampere GPUs -- keep it structurally aligned with that file. Env kwargs
## reach `oolong.load_environment` ONLY through `[orchestrator.train.env.args]`,
## and a key in the wrong table is silently ignored rather than rejected.
##
## Nothing here is a tuning knob for V0. If a run is failing, the answer is not
## to change max_steps, batch_size or the model -- it is to find out why.
## Changing a value to "make it work" invalidates the one number this run
## exists to produce: seconds per step.

output_dir = "outputs/rlm-v0-smoke"
max_steps = 20
seq_len = 8192

[model]
name = "Qwen/Qwen3-8B"

[wandb]
project = "rlm-context-management"
name = "v0-smoke"

[deployment]
# Both GPUs in ONE pod: prime-rl needs the trainer and the inference server on
# the same node. One of each at V0 scale.
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[trainer]

[trainer.model]
# WILL BITE #1. flash_attention_3 is Hopper-only and will not build on Ampere.
# The 30B example config assumes A100/H100; the A40 is Ampere. This is the most
# likely first crash, and it happens during model init, so it presents as "the
# run never started" rather than as a config error.
#
# VERIFY THIS KEY NAME against your prime-rl version before the first launch --
# the 30B reference config does not set it, so the spelling is not confirmed
# from anything in the rlm checkout. If prime-rl ignores or rejects it, find its
# equivalent rather than dropping the setting.
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

# Activation checkpointing. NOT optional at this scale: without it the trainer
# OOMs in the backward pass on step 1 with
#   torch.OutOfMemoryError: Tried to allocate 186.00 MiB.
#   GPU has 44.43 GiB capacity, 176.62 MiB free
# on a 48GB A6000, and would do the same on a 48GB A40. The failure is in the
# QKV projection (Linear 4096 -> 12288), i.e. stored activations, not weights:
# Qwen3-8B bf16 is only ~16GB and LoRA adds 30M trainable params.
#
# `full` recomputes whole transformer blocks rather than storing their
# activations. It costs roughly 30% step time and is what makes the run fit.
# Note step 0 SUCCEEDS without this -- it collects rollouts and only trains at
# the step boundary -- so the OOM arrives one step later than the cause.
[trainer.model.ac]
mode = "full"
freq = 1

[trainer.ckpt]
interval = 10
keep_interval = 10

[trainer.optim]
lr = 5e-5

[inference]
gpu_memory_utilization = 0.80

[inference.model]
# ~16GB weights + ~28GB KV on a 48GB A40 is roughly 11 concurrent 16k
# sequences. Comfortable at this batch size.
max_model_len = 16384
enforce_eager = false

[inference.parallel]
tp = 1
dp = 1

[orchestrator]
batch_size = 8
rollouts_per_example = 4        # 8 x 4 = 32 rollouts/step, 640 for the run

[[orchestrator.filters]]
type = "zero_advantage"
enforce = true

[orchestrator.ckpt]
interval = 10
keep_interval = 10

[orchestrator.train.sampling]
max_completion_tokens = 2048
# WILL BITE #2. Qwen3-8B is hybrid-thinking. Left enabled, trajectories spend
# their whole token budget on reasoning traces before ever reaching the REPL.
# The run looks completely alive and produces nothing usable.
extra_body = { enable_thinking = false }

[[orchestrator.train.env]]
id = "oolong"
name = "oolong-spam-train"
ratio = 1.0

[orchestrator.train.env.args]
# These become keyword arguments to `oolong.load_environment()`. This table is
# the only path by which they reach the environment.
dataset_name = "spam"           # train on the OOLONG-Spam split only
min_ctx = 32768
max_ctx = 65536
exclude_numeric = true
num_examples = -1
max_iterations = 12
sub_max_tokens = 2048
min_iterations = 2

# WILL BITE #3, and the reason this repo pins a fork of rlm.
#
# Selects the no-recursion arm. One flag drives the REPL globals, the system
# prompt, the orchestrator addendum and the rubric's sub-call gate, so the
# state that is the real danger -- a prompt offering `llm_query` to a REPL that
# no longer binds it, every rollout dying on NameError while the run looks
# perfectly healthy from outside -- is unrepresentable rather than merely
# detected.
#
# Requires sid19arya/rlm @ context-mgmt, pinned in setup.sh. Upstream rlm has
# no such parameter and `load_environment` would reject it. Run
# verify_ablation.py before launching: it checks the flag is actually wired,
# which no amount of reading this file can tell you.
enable_sub_lm = false

# With sub-LM calls unavailable a sub-call floor would fail `_passes_gates` on
# every rollout, making `rlm_below_min_subcall` a constant 1 and `gated_reward`
# a constant 0. The fork forces this to 0 when enable_sub_lm is false; stated
# explicitly here so the config carries the intent rather than relying on that.
# (The 30B reference config also uses 0.)
min_subcall = 0

## VRAM budget, for reference when reading nvidia-smi:
##   inference GPU: ~16GB weights + ~28GB KV  => ~11 concurrent 16k sequences
##   trainer GPU:   ~16GB frozen + 0.4GB adapter + activations
## Both fit in 48GB with room to spare. If they do not, something else is
## resident and the startup gate should have caught it.
##
## Why 20 steps cannot answer the research question: at 32 rollouts/step with
## roughly binary reward at p~0.24, the standard error per step is
## 0.43/sqrt(32) ~ +/-7.6 points, so a real 5-point gain is invisible. Movement
## on a task like this appears around 10k-30k cumulative rollouts; V0 produces
## 640. The deliverable is seconds per step, not the reward curve.

# Resume. VERIFIED on 2026-09-08: with this set, the run logs
#   "Resuming from step 10, cleaning future rollouts and broadcasts"
# and continues with model, optimizer and scheduler state restored.
#
# It MUST be top-level [ckpt]. Setting resume_step under [trainer.ckpt] and
# [orchestrator.ckpt] -- which looks right, since those are where interval and
# keep_interval live -- does nothing, and the run dies at startup with
#   FileExistsError: Directory 'outputs/rlm-v0-smoke' already contains
#   checkpoints from a previous run.
#
# -1 resumes the LATEST checkpoint on disk, so no step number needs hardcoding.
# Commented out because leaving it on makes a fresh experiment silently
# continue an old one.
# [ckpt]
# resume_step = -1
